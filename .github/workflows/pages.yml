name: pages

# Builds the frame recordings from the firmware, then publishes web/. The
# recordings are generated rather than committed, so this workflow is the only
# place the site's data comes from and it cannot drift from src/.
#
# Enable once in the repository settings: Settings -> Pages -> Source ->
# GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install platformio

      - name: Build the host harness
        run: pio run -e native

      - name: Record frames
        run: .pio/build/native/program --dump-frames web/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
