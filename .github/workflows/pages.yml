name: pages

# Publishes the committed demo bundle. Generation happens locally through
# `npm run build:dist`; the pre-push hook refuses to push stale generated output.
# Keeping build tools out of this deployment job makes Pages fast and makes a
# clone usable without first reproducing the entire native/WASM toolchain.
#
# Enable once in the repository settings: Settings -> Pages -> Source ->
# GitHub Actions. `configure-pages` cannot create the site with the default
# GITHUB_TOKEN; its `enablement: true` input requires a separate token with
# repository administration/Pages permissions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
