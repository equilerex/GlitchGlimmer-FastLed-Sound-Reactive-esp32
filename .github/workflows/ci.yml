name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The device build is the check that matters most, because it is the only one
  # that compiles at -std=gnu++11. Anything C++17 or newer that reaches
  # device-reachable code passes the native build and fails here.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e ttgo-t1

  # The host harness drives the real controller, scene director and layer stack
  # over a clock it owns, and asserts on the result. It needs nothing but a
  # host C++ compiler, which the runner already has.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e native -t exec

  # The browser visualiser is the firmware's own code compiled by a different
  # toolchain, and nothing in the other two jobs compiles it. Its sources overlap
  # src/ but its flags do not, so a change can pass both of them and break here.
  # The version is pinned to the one the module in web/live was built with, since
  # an Emscripten upgrade changes the glue the page calls into.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e native
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
      - run: tools/build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: glitchglimmer-wasm
          path: |
            web/live/glitchglimmer.js
            web/live/glitchglimmer.wasm
