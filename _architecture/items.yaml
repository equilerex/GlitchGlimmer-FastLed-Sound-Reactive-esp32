  i26b:
    title: Decide what level should mean
    status: parked
    priority: 7000
    body: |-
      `level` is the envelope over the loudest envelope of the last ~20 s, so a steady passage reads 70 to 100 percent. A floor at eight times the noise floor stops near-silence reading loud. Steady music still sits high.

      Options: (1) a much longer reference plus a curve such as level squared. (2) an absolute anchor at a typical loud-music RMS, which needs per-microphone calibration. (3) leave level relative and relabel the meter. Recommendation in the old note was 1. Changing it moves every level threshold and the ladder edges.

      Phase 5 evidence, 28-09-2026. Not a decision. On a tone at 1.7 times a floor near 0.0004, level was 0.15 on the first quiet block and 0.31 when the gate flag cleared, because `LEVEL_ENV_RELEASE` is slower than the hangover. After about nine more seconds it stayed under 0.5. The reported 91 percent did not appear.

      Next: the owner picks an option. Then re-run the harness and check on real audio.
    ts_created: 2026-09-28T19:36:37Z
    ts_started: null
    ts_done: null
    ts_touched: 2026-09-28T19:36:37Z
