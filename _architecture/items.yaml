  k4b7:
    title: Tune the moods on real recordings
    status: now
    priority: 0
    body: |-
      The mood system runs end to end (`_architecture/plans/2026-09-28-base-layer-mood.md`, built 29-09-2026): readings, `kMoodTable` in `src/audio/Moods.h`, fit lists in `src/animations/AnimationFit.h`, the selector, the drop base, the layers, the board. Every breakpoint, time constant and fit is a draft and none is validated. Brightness breakpoints in particular are guesses, since the centroid's scale on real audio was not known.

      Next: the owner records 60 to 120 s `.f32` files with the live page's Record button (techno, drum and bass, melodic rock, organic, chill) and marks moods by ear per section in the ground-truth format (`web/audio/local/ground_truth.json` has the shape) before looking at any reading. Then tune in the emulator's Mood tuning section, and paste `Copy mood table` into the header. `npm run native -- --replay <file>` (with the WinLibs runtime on PATH, see AGENTS.md) prints each reading, each mood strength and the scenes the selector would pick, and writes a trace. A row whose strength does not follow the ear is rewritten or marked not measurable, with what was tried, in the plan.

      Also to check on those recordings: whether Full stays high on everything (it did on `demo.f32`, at about 0.85), whether punch separates Driving from Flowing, whether tempo half-time reads on drum and bass are rare enough for Rushing, and the drop hold's shift thresholds against the payoff and pause sections in the ground truth. Tune the fit lists after the moods, not before.

      Not done from plan step 3: the mood marks drawn under the strengths in the recording view. It has no audio timeline yet.
    ts_created: 2026-09-28T23:29:16Z
    ts_started: 2026-09-28T23:29:16Z
    ts_done: null
    ts_touched: 2026-09-28T23:29:16Z
