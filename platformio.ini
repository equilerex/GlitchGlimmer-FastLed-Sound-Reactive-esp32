; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A bare `pio run` builds the device firmware, which is what this repo ships.
; Neither command needs a board attached: no environment sets upload_port, and
; only `-t upload` touches a port. `.pio` is gitignored.
;     pio run                      the firmware, via default_envs below
;     pio run -e esp32s3          the same thing, spelled out
;     pio run -e native -t exec    the host harness over the real scene and
;                                  layer code; needs a host C++ compiler on PATH
[platformio]
default_envs = esp32s3

[env]
build_flags =
    -D ARDUINO_ESP32S3_DEV
    -D CONFIG_OLED_SDA=8
    -D CONFIG_OLED_SCL=9
    -D CONFIG_LED_DATA_PIN=4
    -D CONFIG_BTN1=0

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -std=gnu++11
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCONFIG_ESP_TASK_WDT_EN=0
    -DCONFIG_ESP_INT_WDT_EN=0
    -DCONFIG_FREERTOS_WATCHPOINT_END_OF_STACK=0
; Everything src/ includes is named here. It used to point at a global Arduino
; libraries directory instead, by an absolute path that only resolved on the
; machine it was written for, so a fresh clone could not find three of the four.
; TFT_eSPI's display settings come from include/tft_setup.h, not from build
; flags, which is why there are no -D defines for it here.
lib_deps =
    fastled/FastLED@^3.7.0
    lennarthennigs/Button2@^2.3.5
    kosme/arduinoFFT@^2.0.4
    bodmer/TFT_eSPI@^2.5.43

; Everything under src/ builds, minus the host harness, which defines its own
; main(), millis(), Serial and operator new, and minus the browser entry point,
; which needs the Emscripten headers. The previous filter excluded main.ino,
; which is the only file holding setup() and loop(), so the firmware could not
; link; it also named core/MainController.cpp by a path that does not exist. Add
; files to exclude individually here.
build_src_filter =
    +<*>
    -<sim_main.cpp>
    -<wasm_main.cpp>

; Host build of the scene and layer lifecycle. Compiles the real LayerManager,
; SceneRegistry, SceneState, SceneDirector, LEDStripController and AudioProcessor
; against a stub Arduino core, and drives them from src/sim_main.cpp. Run it with:
;     pio run -e native -t exec
; Unlike every other environment here this one uses the system compiler, so it
; needs a host g++ reachable through PATH. Nothing else in the project does.
[env:native]
platform = native
lib_deps =
    fastled/FastLED@^3.7.0
    kosme/arduinoFFT@^2.0.4
; FastLED declares frameworks = arduino, and this environment has no framework, so
; the dependency finder drops the library as incompatible and FastLED.h goes
; missing. off disables that check, which was the whole problem: the default chain
; mode then resolves FastLED.h from the entry point and builds several times
; faster than deep+, which compiles the entire library on every build.
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Isim/stubs
; Just the two unused-value warnings, not -Wall. The defect class this project
; spent a whole sweep on was a value computed against the wrong scale and then
; read, and its sibling is a value computed against the wrong scale and never
; read at all: neonFlow.h's `flicker = audio.dynamics * 255` sat in a build that
; passed green everywhere. -Wall adds a large amount of noise from FastLED's own
; headers, so this names the two checks that catch the thing and stops there.
    -Wunused-variable
    -Wunused-but-set-variable
; AudioProcessor.cpp is the only file that branches on this, and it uses it to
; swap the ESP32 I2S peripheral for submitSamples(). Without it the harness cannot
; compile the FFT at all, which is how analyzeAudio() shipped without ever having
; been executed: it was excluded from this environment and from nothing else.
    -DGG_HOST_BUILD
build_src_filter =
    +<sim_main.cpp>
    +<scenes/*.cpp>
    +<animations/*.cpp>
    +<audio/AudioProcessor.cpp>
