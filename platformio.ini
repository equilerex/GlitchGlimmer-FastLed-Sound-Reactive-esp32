; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; A bare `pio run` builds the device firmware, which is what this repo ships.
; Neither command needs a board attached: no environment sets upload_port, and
; only `-t upload` touches a port. `.pio` is gitignored.
;     pio run                      the firmware, via default_envs below
;     pio run -e ttgo-t1           the same thing, spelled out
;     pio run -e native -t exec    the host harness over the real scene and
;                                  layer code; needs a host C++ compiler on PATH
[platformio]
default_envs = ttgo-t1

[env:ttgo-t1]
platform = espressif32
board = ttgo-t1
framework = arduino
lib_extra_dirs = C:/Users/Joosep/Documents/Arduino/libraries
monitor_speed = 115200
build_flags =
    -std=gnu++11
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    fastled/FastLED@^3.5.0

; Everything under src/ builds, minus the host harness, which defines its own
; main(), millis(), Serial and operator new. The previous filter excluded
; main.ino, which is the only file holding setup() and loop(), so the firmware
; could not link; it also named core/MainController.cpp by a path that does not
; exist. Add files to exclude individually here.
build_src_filter =
    +<*>
    -<sim_main.cpp>

; Host build of the scene and layer lifecycle. Compiles the real LayerManager,
; SceneRegistry, SceneState, SceneDirector and LEDStripController against a stub
; Arduino core, and drives them from src/sim_main.cpp. Run it with:
;     pio run -e native -t exec
; Unlike every other environment here this one uses the system compiler, so it
; needs a host g++ reachable through PATH. Nothing else in the project does.
[env:native]
platform = native
lib_deps =
    fastled/FastLED@^3.5.0
; FastLED declares frameworks = arduino, and this environment has no framework, so
; the dependency finder drops the library as incompatible and FastLED.h goes
; missing. off disables that check, which was the whole problem: the default chain
; mode then resolves FastLED.h from the entry point and builds several times
; faster than deep+, which compiles the entire library on every build.
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Isim/stubs
build_src_filter =
    +<sim_main.cpp>
    +<scenes/*.cpp>
    +<animations/*.cpp>
